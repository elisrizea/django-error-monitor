[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-error-monitor"
version = "0.1.0"
description = "Lightweight in-database error capture, grouping and email alerts for Django — a self-hosted Sentry-lite."
readme = "README.md"
requires-python = ">=3.9"
license = "0BSD"
authors = [{ name = "Alin Rizea" }]
keywords = ["django", "error", "monitoring", "exceptions", "logging", "alerts", "sentry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
# Optional: dispatch alert emails through a django-q worker instead of sending
# them synchronously in the request. The package works fine without it.
async = ["django-q2>=1.6"]

[project.urls]
Homepage = "https://github.com/elisrizea/django-error-monitor"
Source = "https://github.com/elisrizea/django-error-monitor"
Issues = "https://github.com/elisrizea/django-error-monitor/issues"

[tool.hatch.build.targets.wheel]
packages = ["ai_monitoring"]
